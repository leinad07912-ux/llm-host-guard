name: refresh-versions
on:
  schedule: [{cron: "0 2 * * 1"}]   # Mondays 02:00 UTC
  workflow_dispatch:
permissions: {contents: write, pull-requests: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/refresh_versions.py
      - name: Open PR if data changed (never auto-merged)
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: |
          python -c "import json;json.load(open('llm_host_guard/data/cves.json'))"
          git diff --quiet && exit 0
          b=refresh-versions-$(date +%F)
          git config user.name "version-refresh"; git config user.email "actions@users.noreply.github.com"
          git checkout -b "$b"; git commit -am "data: weekly agent version + advisory refresh"; git push origin "$b"
          gh pr create --title "Weekly agent version refresh" --body "Generated by tools/refresh_versions.py from npm, PyPI and GHSA. Review, then merge." --head "$b"
